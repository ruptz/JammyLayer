[package]
name = "jammylayer"
version = "0.3.2"
description = "Spotify now-playing overlay for OBS"
authors = ["ruptz"]
edition = "2024"

[lib]
# The _lib suffix keeps the library's name apart from the binary's, which
# Cargo otherwise trips over on Windows.
name = "jammylayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Spotify and Twitch sign-in and APIs, and secrets in the system keystore,
# shared with the other Layer apps.
layer-secrets = { git = "https://github.com/ruptz/LayerKit", tag = "v0.4.0" }
layer-spotify = { git = "https://github.com/ruptz/LayerKit", tag = "v0.4.0" }
layer-twitch = { git = "https://github.com/ruptz/LayerKit", tag = "v0.5.0" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
