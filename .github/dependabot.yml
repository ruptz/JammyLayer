version: 2

# Weekly is frequent enough for a project that ships on tags, not on merge.
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor and patch bumps arrive as one PR, so a busy week of crate
    # releases costs one CI run instead of one per crate. Majors stay
    # separate so they get read.
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  # The root holds only the Tauri CLI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
