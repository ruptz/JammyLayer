# Builds the desktop installers and attaches them to a draft GitHub Release, so
# nobody needs Node, npm or Rust to run JammyLayer — they download one file.
#
# Cut a release by pushing a tag that matches the version in package.json,
# src-tauri/Cargo.toml and src-tauri/tauri.conf.json:
#
#   git tag v0.3.0
#   git push origin v0.3.0
#
# Or run it from the Actions tab to build the installers without releasing
# anything: the build jobs still upload their output as workflow artifacts.
#
# Nothing is code-signed, which is why the installers trip SmartScreen and
# Gatekeeper.
#
# Every platform also ships JammyLayer-<version>-<platform>.zip, the app on its
# own, which the WidgetCake launcher downloads and installs; Windows keeps the
# name -win.zip it has always had. Tauri builds a single program with the pages
# inside it, so the zip holds that program, or the .app on macOS.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. The build jobs run `npm ci` and compile dependencies,
# and there is no reason for that to hold a token that can write to the
# repository. Only the release job is granted write, because gh has to create
# the release.
permissions:
  contents: read

# One release run per tag at a time; a second push of the same tag waits
# rather than racing the first to create the release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The installers take their version from the project files, not from the tag,
  # so a tag that disagrees would ship installers named after the previous
  # release. One cheap job up front beats finding out from a user.
  verify:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          for v in "$pkg" "$conf" "$cargo"; do
            if [ "$tag" != "$v" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json ($pkg), tauri.conf.json ($conf) and Cargo.toml ($cargo)"
              exit 1
            fi
          done
          echo "$GITHUB_REF_NAME matches"

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      # Windows is the tested platform. A failure on either of the others should
      # not stop it shipping.
      fail-fast: false
      matrix:
        include:
          - name: windows
            platform: win
            os: windows-latest
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          - name: macos-arm64
            platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --bundles app,dmg --target aarch64-apple-darwin
            files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            platform: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --bundles app,dmg --target x86_64-apple-darwin
            files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux-x64
            platform: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - name: linux-arm64
            platform: linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles appimage,deb
            files: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # No Rust cache here on purpose: a tag's cache can't be restored by the
      # next tag, so saving one would only add minutes of upload to every
      # build.

      # The web view, and the tray's indicator library, that Tauri builds against.
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The Tauri command-line tools; the app itself has no npm dependencies.
      - run: npm ci

      - name: Build installer
        run: npm run build -- ${{ matrix.args }}

      # The app on its own, for WidgetCake: JammyLayer-<version>-<platform>.zip.
      # Windows keeps the -win.zip name the launcher has always looked for.
      - name: Zip the app for WidgetCake
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          # Relative, not $PWD: on Windows, Git Bash would hand PowerShell a
          # /d/a/... path, which it reads as a folder named d on drive D.
          zip="JammyLayer-$version-${{ matrix.platform }}.zip"
          release="src-tauri/target/${{ matrix.target }}/release"
          release="${release//\/\//\/}"
          mkdir -p launcher app
          case "${{ matrix.platform }}" in
            win)
              cp "$release/jammylayer.exe" app/JammyLayer.exe
              (cd app && pwsh -NoProfile -Command "Compress-Archive -Path * -DestinationPath '../launcher/$zip'")
              ;;
            macos-*)
              # ditto keeps the bundle's permissions and structure intact.
              ditto -c -k --keepParent "$release"/bundle/macos/*.app "launcher/$zip"
              ;;
            linux-*)
              cp "$release/jammylayer" app/JammyLayer
              (cd app && zip -r -y "../launcher/$zip" .)
              ;;
          esac
          ls -la launcher

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            ${{ matrix.files }}
            launcher/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    permissions:
      contents: write
    # Runs even if one platform failed, so a broken macOS build cannot hold up a
    # working Windows one. The release is a draft — check what is attached
    # before publishing it.
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installer-*
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The Linux builds arrive inside appimage/ and deb/ folders, so collect
        # the files themselves rather than whatever sits at the top level.
        run: |
          mapfile -t files < <(find installers -type f | sort)
          ls -la "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --draft \
            --generate-notes \
            --title "JammyLayer $GITHUB_REF_NAME"
