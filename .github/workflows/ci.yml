name: CI

# Fast checks on every push and pull request: the Rust side compiles and its
# tests pass on all three systems, and the app builds without an installer.

on:
  # Branches other than master are covered by their pull request, so a commit
  # on a PR branch is checked once, not once per trigger.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only. Nothing here publishes anything; release.yml is the only workflow
# that needs more than this.
permissions:
  contents: read

jobs:
  test:
    name: Rust tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Nobody here runs macOS or Linux, so this is where a break on either
      # shows up first. One failing must not hide the others.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Saved from master only: pull requests restore it but never overwrite
      # it, so one PR can't evict the cache every other run starts from.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

      # A debug build, so it reuses everything the tests just compiled instead
      # of building every dependency again in release mode. No installer: this
      # is here to catch a broken Tauri config or a resource path that no
      # longer exists.
      - name: Build
        run: npm run build -- --debug --no-bundle
