name: jammylayer

services:
  overlay:
    build: .
    image: jammylayer:latest
    container_name: jammylayer
    restart: unless-stopped
    ports:
      # Bound to all interfaces so other machines on the LAN can reach the
      # overlay at http://<vps-ip>:8888/
      - "8888:8888"
    env_file:
      - .env
    environment:
      PORT: "8888"
      DATA_DIR: /data
    volumes:
      # A named volume, not a bind mount: the container runs as uid 1000 and a
      # host directory created by root would not be writable.
      - tokens:/data

volumes:
  # Pinned to the pre-rename name on purpose. Compose prefixes volumes with the
  # project name, so renaming the project to jammylayer would have quietly
  # created an empty volume and lost the refresh token on an existing deploy.
  tokens:
    name: spotify-overlay_tokens
